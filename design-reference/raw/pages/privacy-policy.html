<script>
  // Navbar height and background color adjustment on scroll with easing
document.addEventListener('DOMContentLoaded', function() {
  const navbar = document.querySelector('.navbar3_component');
  
  // Store the original background color on page load
  const originalBgColor = window.getComputedStyle(navbar).backgroundColor;
  
  // Add CSS transition for smooth easing (including border)
  navbar.style.transition = 'min-height 0.3s ease, background-color 0.3s ease, border-bottom-color 0.3s ease';
  
  // Set initial border state to transparent black
  navbar.style.borderBottom = '2.5px solid rgba(0, 0, 0, 0)';
  
  // Set initial state
  updateNavbar();
  
  // Add scroll event listener
  window.addEventListener('scroll', updateNavbar);
  
  function updateNavbar() {
    if (window.scrollY >= 32) {
      navbar.style.minHeight = '3.75rem'; // 3.75rem when scrolled 32px or more
      navbar.style.backgroundColor = 'white'; // Change bg to white when scrolled
      navbar.style.borderBottomColor = 'rgba(0, 0, 0, 1)'; // Solid black border when scrolled
    } else {
      navbar.style.minHeight = ''; // Reset to default when scrolled less than 32px
      navbar.style.backgroundColor = originalBgColor; // Reset to original color (captured on page load)
      navbar.style.borderBottomColor = 'rgba(0, 0, 0, 0)'; // Transparent border on top
    }
  }
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Close popup when ESC key is pressed
  document.addEventListener('keydown', function(event) {
    // Check if the key pressed is ESC (key code 27)
    if (event.key === "Escape" || event.keyCode === 27) {
      // Find the popup-wrapper.form element
      const popupWrapper = document.querySelector('.popup-wrapper.form');
      
      // Check if it exists and is visible
      if (popupWrapper && getComputedStyle(popupWrapper).display !== 'none') {
        // Hide it by setting display to 'none'
        popupWrapper.style.display = 'none';
      }
    }
  });
  
  // Close popup when clicking on the wrapper (but not its contents)
  document.addEventListener('click', function(event) {
    // Check if the clicked element has both popup-wrapper and form classes
    if (event.target.matches('.popup-wrapper.form')) {
      // If clicked on the wrapper itself (not its children), hide it
      event.target.style.display = 'none';
    }
  });
});
</script>

  const CIRCLE_COUPON_PARAM = "coupon_code";
  const FBCLID_KEY = "fbclid";

  // ---- helpers ----
  function getQueryParams() {
    // Full query from landing URL (includes UTMs + fbclid if present)
    return new URLSearchParams(window.location.search);
  }

  function mergeParamsIntoUrl(href, incomingParams) {
    try {
      const url = new URL(href, window.location.origin);
      // merge without duplicating
      incomingParams.forEach((v, k) => {
        if (!url.searchParams.has(k)) url.searchParams.set(k, v);
      });
      return url.toString();
    } catch { return href; }
  }

  function getRewardfulData() {
    const raw = document.cookie.split("; ").find(r => r.startsWith("rewardful.referral="));
    if (!raw) return null;
    try {
      const decoded = decodeURIComponent(raw.split("=")[1]);
      return JSON.parse(decoded); // {affiliate: "...", ...}
    } catch { return null; }
  }

  function appendCouponIfNeeded(href, hasAffiliate) {
    try {
      const url = new URL(href, window.location.origin);
      const host = url.hostname;

      if (hasAffiliate) {
        // Circle uses coupon_code, SamCart uses coupon
        const couponParam = host.includes("circle.so") ? CIRCLE_COUPON_PARAM : SHOP_COUPON_PARAM;
        if (!url.searchParams.has(couponParam)) {
          url.searchParams.set(couponParam, AFFILIATE_COUPON);
        }
      }
      return url.toString();
    } catch { return href; }
  }

  function processLinks(root) {
    // Targets BOTH SamCart link types + Circle
    const sel = [
      "a[href*='shop.30mpc.com/products/']",
      "a[href*='shop.30mpc.com/checkout/']",
      "a[href*='circle.so/checkout']"
    ].join(",");

    const incoming = getQueryParams();
    const hasAffiliate = !!(getRewardfulData() && getRewardfulData().affiliate);

    root.querySelectorAll(sel).forEach(a => {
      // 1) carry UTMs/fbclid (don’t overwrite existing)
      let href = mergeParamsIntoUrl(a.href, incoming);
      // 2) append Rewardful coupon only if cookie present and coupon not already on URL
      href = appendCouponIfNeeded(href, hasAffiliate);
      a.href = href;
    });
  }

  // Initial pass
  processLinks(document);

  // Handle links injected later (Webflow interactions/CMS)
  const mo = new MutationObserver(muts => {
    muts.forEach(m => m.addedNodes.forEach(n => {
      if (n.nodeType === 1) processLinks(n);
    }));
  });
  mo.observe(document.body, { childList: true, subtree: true });

  // Optional: persist fbclid for cross-subdomain reads (not required if you pass via URL)
  try {
    const p = new URLSearchParams(window.location.search);
    const fbclid = p.get(FBCLID_KEY);
    if (fbclid) {
      document.cookie = `${FBCLID_KEY}=${fbclid}; path=/; domain=.30mpc.com; max-age=2592000; samesite=Lax`;
    }
  } catch {}
});
</script>

<!-- infinite logo loop -->
<script>
  // marquee power up
  function attr(defaultVal, attrVal) {
    const defaultValType = typeof defaultVal;
    if (typeof attrVal !== "string" || attrVal.trim() === "") return defaultVal;
    if (attrVal === "true" && defaultValType === "boolean") return true;
    if (attrVal === "false" && defaultValType === "boolean") return false;
    if (isNaN(attrVal) && defaultValType === "string") return attrVal;
    if (!isNaN(attrVal) && defaultValType === "number") return +attrVal;
    return defaultVal;
  }
  // marquee component
  $("[tr-marquee-element='component']").each(function (index) {
    let componentEl = $(this),
        panelEl = componentEl.find("[tr-marquee-element='panel']"),
        triggerHoverEl = componentEl.find("[tr-marquee-element='triggerhover']"),
        triggerClickEl = componentEl.find("[tr-marquee-element='triggerclick']");
    let speedSetting = attr(100, componentEl.attr("tr-marquee-speed")),
        verticalSetting = attr(false, componentEl.attr("tr-marquee-vertical")),
        reverseSetting = attr(false, componentEl.attr("tr-marquee-reverse")),
        scrollDirectionSetting = attr(false, componentEl.attr("tr-marquee-scrolldirection")),
        scrollScrubSetting = attr(false, componentEl.attr("tr-marquee-scrollscrub")),
        moveDistanceSetting = -100,
        timeScaleSetting = 1,
        pausedStateSetting = false;
    if (reverseSetting) moveDistanceSetting = 100;
    let marqueeTimeline = gsap.timeline({
      repeat: -1,
      onReverseComplete: () => marqueeTimeline
      .progress(1)
    });
    if (verticalSetting) {
      speedSetting = panelEl.first().height() / speedSetting;
      marqueeTimeline.fromTo(panelEl, { yPercent: 0 }, {
        yPercent: moveDistanceSetting,
        ease: "none",
        duration: speedSetting
      });
    } else {
      speedSetting = panelEl.first().width() / speedSetting;
      marqueeTimeline.fromTo(panelEl, { xPercent: 0 }, {
        xPercent: moveDistanceSetting,
        ease: "none",
        duration: speedSetting
      });
    }
    let scrubObject = { value: 1 };
    ScrollTrigger.create({
      trigger: "body",
      start: "top top",
      end: "bottom bottom",
      onUpdate: (self) => {
        if (!pausedStateSetting) {
          if (scrollDirectionSetting && timeScaleSetting !== self.direction) {
            timeScaleSetting = self.direction;
            marqueeTimeline.timeScale(self.direction);
          }
          if (scrollScrubSetting) {
            let v = self.getVelocity() * 0.006;
            v = gsap.utils.clamp(-60, 60, v);
            let scrubTimeline = gsap.timeline({
              onUpdate: () => marqueeTimeline.timeScale(
                scrubObject.value)
            });
            scrubTimeline.fromTo(scrubObject, { value: v }, {
              value: timeScaleSetting,
              duration: 0.5
            });
          }
        }
      }
    });

    function pauseMarquee(isPausing) {
      pausedStateSetting = isPausing;
      let pauseObject = { value: 1 };
      let pauseTimeline = gsap.timeline({
        onUpdate: () => marqueeTimeline.timeScale(pauseObject
                                                  .value)
      });
      if (isPausing) {
        pauseTimeline.fromTo(pauseObject, { value: timeScaleSetting }, {
          value: 0,
          duration: 0.5
        });
        triggerClickEl.addClass("is-paused");
      } else {
        pauseTimeline.fromTo(pauseObject, { value: 0 }, {
          value: timeScaleSetting,
          duration: 0.5
        });
        triggerClickEl.removeClass("is-paused");
      }
    }
    if (window.matchMedia("(pointer: fine)").matches) {
      triggerHoverEl.on("mouseenter", () => pauseMarquee(true));
      triggerHoverEl.on("mouseleave", () => pauseMarquee(false));
    }
    triggerClickEl.on("click", function () {
      !$(this).hasClass("is-paused") ? pauseMarquee(true) : pauseMarquee(false);
    });
  });
</script>
